# Fly.io deployment. Step-by-step guide (zh-TW): docs/deploy-fly.md
# Change `app` to the name you created with `fly apps create`; it becomes https://<app>.fly.dev
app = "subscription-billing-change-me"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATA_DIR = "/data"
  COOKIE_SECURE = "true"
  # Fly's edge proxy always overwrites this header with the real client address.
  CLIENT_IP_HEADER = "fly-client-ip"
  TZ = "Asia/Taipei"

# SQLite, its WAL files and the rotating backups live on this volume. Fly also takes a daily
# snapshot of it outside the machine; keep those for 30 days.
[mounts]
  source = "billing_data"
  destination = "/data"
  snapshot_retention = 30

[http_service]
  internal_port = 3000
  force_https = true
  # Stop when idle to save cost; the next request starts it again (a few seconds' delay).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
